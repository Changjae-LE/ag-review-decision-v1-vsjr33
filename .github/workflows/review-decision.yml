name: AttriGuard review decision

on:
  pull_request:
    types: [opened]

concurrency:
  group: review-decision-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      ATTRIGUARD_CONFIGURATION: baseline
    steps:
      - name: Enforce isolated benchmark repository
        shell: bash
        env:
          EXPECTED_OWNER: ${{ vars.ATTRIGUARD_BENCHMARK_OWNER }}
          EXPECTED_PREFIX: ${{ vars.ATTRIGUARD_BENCHMARK_PREFIX }}
          EXPECTED_REPOSITORY_ID: ${{ vars.ATTRIGUARD_BENCHMARK_REPOSITORY_ID }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVALUATION_REF: ${{ vars.ATTRIGUARD_EVALUATION_REF }}
        run: |
          set -euo pipefail
          actual_owner="${GITHUB_REPOSITORY%%/*}"
          actual_name="${GITHUB_REPOSITORY#*/}"
          if [[ "${actual_owner}" != "${EXPECTED_OWNER}" ]]; then
            echo "Refusing non-benchmark owner" >&2
            exit 1
          fi
          if [[ "${actual_name}" != "${EXPECTED_PREFIX}"* ]]; then
            echo "Refusing repository outside benchmark prefix" >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]] ||
             [[ "${EVENT_REPOSITORY_ID}" != "${EXPECTED_REPOSITORY_ID}" ]]; then
            echo "Refusing repository ID not bound by the GitInject provisioner" >&2
            exit 1
          fi
          if [[ ! "${EVALUATION_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ATTRIGUARD_EVALUATION_REF must be an immutable 40-hex commit" >&2
            exit 1
          fi

      - name: Check out trusted evaluation harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.ATTRIGUARD_EVALUATION_REPOSITORY }}
          ref: ${{ vars.ATTRIGUARD_EVALUATION_REF }}
          path: evaluation
          token: ${{ secrets.ATTRIGUARD_HARNESS_READ_TOKEN }}
          persist-credentials: false

      - name: Set up AttriGuard Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: evaluation/pyproject.toml

      - name: Install trusted evaluation harness
        shell: bash
        run: python -m pip install --disable-pip-version-check ./evaluation

      - name: Fetch and verify official AttriGuard artifact
        shell: bash
        env:
          ATTRIGUARD_ARTIFACT_ROOT: ${{ runner.temp }}/attriguard-official
        run: >-
          python evaluation/scripts/fetch_attriguard_artifact.py
          --destination "${ATTRIGUARD_ARTIFACT_ROOT}"

      - name: Verify review adapter with official core before model calls
        env:
          ATTRIGUARD_ARTIFACT_ROOT: ${{ runner.temp }}/attriguard-official
        run: python -m unittest discover -s evaluation/tests -p test_review_decision.py -v

      - name: Run review decision agent
        env:
          ATTRIGUARD_BENCHMARK_OWNER: ${{ vars.ATTRIGUARD_BENCHMARK_OWNER }}
          ATTRIGUARD_BENCHMARK_PREFIX: ${{ vars.ATTRIGUARD_BENCHMARK_PREFIX }}
          ATTRIGUARD_BENCHMARK_REPOSITORY_ID: ${{ vars.ATTRIGUARD_BENCHMARK_REPOSITORY_ID }}
          ATTRIGUARD_TARGET_MODEL: ${{ vars.ATTRIGUARD_TARGET_MODEL }}
          ATTRIGUARD_AUXILIARY_MODEL: ${{ vars.ATTRIGUARD_AUXILIARY_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python evaluation/scripts/run_review_decision_action.py
          --configuration "${ATTRIGUARD_CONFIGURATION}"
          --artifact-root "${{ runner.temp }}/attriguard-official"
          --output "${{ runner.temp }}/review-evidence"

      - name: Validate review evidence
        if: always()
        run: >-
          python evaluation/scripts/run_review_decision_action.py
          --verify-output "${{ runner.temp }}/review-evidence/trial.json"

      - name: Upload local evidence separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attriguard-task-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-evidence/
          if-no-files-found: error
          retention-days: 30

